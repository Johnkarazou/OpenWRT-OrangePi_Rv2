name: Build RV2 (25.12)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
          gettext git libncurses-dev libssl-dev python3-distutils python3-setuptools python3-dev rsync unzip zlib1g-dev \
          file wget time jq curl cmake swig libelf-dev

    - name: Cache Download Directory (dl)
      uses: actions/cache@v4
      with:
        path: dl
        key: ${{ runner.os }}-openwrt-dl-${{ hashFiles('**/feeds.conf.default') }}
        restore-keys: |
          ${{ runner.os }}-openwrt-dl-

    - name: Update & Install Feeds
      run: |
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Configure Firmware
      run: |
        cp orangepi_rv2_defconfig .config
        make defconfig

    - name: Download Sources
      run: make -j$(nproc) download

    - name: Build Firmware
      run: make -j$(($(nproc)+1))

    - name: Upload Firmware Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: openwrt-rv2-firmware
        path: bin/targets/
        retention-days: 7
